services:
  - type: web
    name: salesforce-junior-academy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/academy.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: academy-data
      mountPath: /var/data
      sizeGB: 1
